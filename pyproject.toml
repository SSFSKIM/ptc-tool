[project]
name = "ptc"
version = "0.1.0"
description = "Programmatic Tool Calling for Claude Code on a persistent IPython kernel"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
    # >=2.0: the adapter imports mcp.server.mcpserver.MCPServer, which replaced FastMCP
    # (mcp.server.fastmcp) in 2.0.0 — a 1.x resolution would import-error at startup.
    "mcp>=2.0",
    "claude-agent-sdk==0.2.142",
    "httpx>=0.27",
    "markdownify>=0.13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
kernel = ["pandas", "numpy", "pyyaml", "matplotlib"]

[project.scripts]
ptc = "ptc.cli:main"
ptc-mcp = "ptc.mcp:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptc"]
